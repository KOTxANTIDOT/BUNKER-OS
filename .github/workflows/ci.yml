name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:testOssDebugUnitTest app:assembleOssDebug
      - name: Upload Bunker Cat debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Bunker-Cat-debug-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
